repos:
  - repo: local
    hooks:
      - id: bump-parent-submodule-ref
        name: Bump mlops-get-started ref in vps-apps
        entry: bash -c "git -C /opt/vps-apps submodule update --remote 'mlops-get-started' && git -C /opt/vps-apps add 'mlops-get-started'"
        language: system
        pass_filenames: false
        always_run: true
        stages: [post-commit]
